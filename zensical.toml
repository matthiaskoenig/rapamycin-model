[project]
site_name = "Physiologically based pharmacokinetic (PBPK) model of rapamycin"
site_url = "https://matthiaskoenig.github.io/rapamycin-model/"
site_description = "This repository provides the rapamycin (sirolimus) physiologically based pharmacokinetic (PBPK) model: its oral absorption, its metabolism by CYP3A4 and CYP3A5 in the intestine and the liver, its distribution in whole blood and the tissues and the excretion of its metabolites."
site_author = "Monika Jesionek and Matthias König"

copyright = "Copyright &copy; 2025-2026 Monika Jesionek and Matthias König"

# pages as `simulations.html`, so the reports which the docs workflow copies into
# the site (`simulations/`, `fit/`) do not replace the pages of the same name
use_directory_urls = false

repo_url = "https://github.com/matthiaskoenig/rapamycin-model"
repo_name = "matthiaskoenig/rapamycin-model"

nav = [
  { "Home" = "index.md" },
  { "Running the model" = "running.md" },
  { "Models" = "models.md" },
  { "Simulations" = "simulations.md" },
  { "Fit" = "fit.md" },
  { "Release notes" = "release-notes.md" },
]

[project.theme]
language = "en"
features = [
  "content.code.copy",
  "navigation.footer",
  "navigation.top",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "teal"
accent = "teal"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "teal"
accent = "teal"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/matthiaskoenig/rapamycin-model"
